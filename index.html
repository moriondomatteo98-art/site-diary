<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Site Diary</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-title" content="Site Diary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: off-white logo bar with red rule, white cards on light grey, black quick-add bar. Palette from the Transform Group logo: black, red dot, off-white. */
:root{
  --bg:#f1f1ef; --surface:#ffffff; --ink:#0b0b0b; --muted:#666666; --line:#e1e1de;
  --brand:#ff3131; --accent:#e42424; --accent-ink:#ffffff; --wip:#f4b400; --wip-ink:#0b0b0b;
  --ok:#1f8a4c; --ok-ink:#ffffff; --warn:#b86e00; --crit:#c81e1e;
  --display:"Poppins","Inter",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101010; --surface:#1b1b1b; --ink:#f4f4f2; --muted:#a3a3a0; --line:#2f2f2f;
    --accent:#ff4a4a; --accent-ink:#0b0b0b; --ok:#4fc27f; --ok-ink:#0f2a1b; --warn:#f0b04a; --crit:#ff6b6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101010; --surface:#1b1b1b; --ink:#f4f4f2; --muted:#a3a3a0; --line:#2f2f2f;
  --accent:#ff4a4a; --accent-ink:#0b0b0b; --ok:#4fc27f; --ok-ink:#0f2a1b; --warn:#f0b04a; --crit:#ff6b6b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
/* No pinch or double-tap zoom, no sideways sliding: the page only scrolls up and down. */
html{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-x:none}
input,select,textarea,button{min-width:0;max-width:100%}
.row>*,.crew>*,.hrs>*,.card,main{min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
/* 16px stops iPhone zooming in when you tap a box */
input,select,textarea{font-size:16px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{width:100%;position:sticky;top:0;z-index:5;background:#f8f8f8;color:#0b0b0b;border-bottom:3px solid var(--brand);padding:8px 16px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
.top .r1,.top .r2{display:flex;align-items:center;gap:8px;min-width:0}
#logo{height:32px;width:auto;display:block}
.tag{font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:#666;margin-right:auto;padding-left:8px;border-left:2px solid #d8d8d6;line-height:1.2;white-space:nowrap}
.top button{background:#ebebe9;border:0;border-radius:10px;color:#0b0b0b;min-height:42px;padding:0 14px;font-weight:600;cursor:pointer}
.top .r2 button{width:42px;padding:0;font-size:20px;flex:none}
.top .r2 button#date{flex:1 1 0;width:0;min-width:0;font-size:15px}
.top .r2 button#histBtn{width:auto;padding:0 12px;font-size:14px;white-space:nowrap}
.top button.on{background:var(--accent);color:#fff}

main{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.dot.busy{background:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px;display:flex;flex-direction:column;gap:12px}
.card.risk{border-left:5px solid var(--brand)}
.card h2,dialog h2{font:600 18px var(--display);letter-spacing:-.01em}
.card h2::after,dialog h2::after{content:".";color:var(--brand)}
.hero .h{font:700 26px var(--display);line-height:1.1}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:default;min-height:72px}
button.tile{cursor:pointer}
.tile span{font-size:13px;color:var(--muted);font-weight:500}
.tile b{font:700 30px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.tile input,.tile select{background:transparent;border:0;padding:0;font:700 22px var(--display);min-height:34px;width:100%;color:var(--ink)}

label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=date],select,textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
.tile input,.tile select{border:0;background:transparent;padding:0}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.pill.low{color:var(--ok)}.pill.med{color:var(--warn)}.pill.high{color:var(--crit)}
.rk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.rk .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-weight:600}
.rk ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.empty{color:var(--muted);font-size:14px}
.ghost{background:transparent;border:1px dashed var(--muted);border-radius:8px;min-height:44px;cursor:pointer;font-weight:600}
.del{background:none;border:0;color:var(--crit);cursor:pointer;font-weight:600;min-height:36px;padding:0 6px}

.dl{display:flex;flex-direction:column;gap:6px}
.dl .it{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-size:15px}
.dl .it small{color:var(--muted);font-variant-numeric:tabular-nums}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.photo input{border:0;border-top:1px solid var(--line);border-radius:0;min-height:40px;font-size:16px}
.photo textarea{border:0;border-top:1px solid var(--line);border-radius:0;min-height:64px;font-size:16px;resize:vertical}
.photo button{background:none;border:0;border-top:1px solid var(--line);color:var(--crit);min-height:36px;cursor:pointer;font-weight:600}

.crew{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.crew{grid-template-columns:repeat(2,1fr)}}
.stepper{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px}
.stepper span{font-size:15px;flex:1;min-width:0}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 20px var(--body);cursor:pointer}
.stepper input.cnt{width:52px;min-height:38px;padding:0 4px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px}
.total strong{font:700 28px var(--display)}
.crane{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center}
.crane .t{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.crane input{min-height:40px}
.hrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hrs button{min-height:48px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.hrs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}

.bar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;z-index:6;background:#0b0b0b;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar button{background:#1f1f1f;border:0;border-radius:12px;color:#fff;min-height:56px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#app.locked .card{opacity:.92}
#app.locked input:disabled,#app.locked textarea:disabled,#app.locked select:disabled{opacity:1;-webkit-text-fill-color:var(--ink);cursor:default}
#app.locked button:disabled:not(#doneBtn):not(#reopenBtn){opacity:.45;cursor:default}
.bar.locked{opacity:.35;pointer-events:none}
.bar button svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(94vw,560px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#dlgIn:focus{outline:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:2px 0}
.cal button,.cal .x{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer;min-height:40px;font-variant-numeric:tabular-nums;padding:0}
.cal .x{border:0;background:transparent;cursor:default}
.cal button.done{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.cal button.wip{background:var(--wip);border-color:var(--wip);color:var(--wip-ink)}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.cur{text-decoration:underline}
.cal.ex button{position:relative;background:var(--bg);border-color:var(--line);color:var(--ink)}
.cal.ex button.done,.cal.ex button.wip{background:var(--bg);border-color:var(--line);color:var(--ink)}
.cal.ex button.inr{background:rgba(255,49,49,.14);border-color:rgba(255,49,49,.3)}
.cal.ex button.inr.done,.cal.ex button.inr.wip{background:rgba(255,49,49,.78);border-color:rgba(255,49,49,.9);color:#fff}
.cal.ex button.edge{outline:2px solid #ff3131;outline-offset:1px}
.cal.ex .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.cal.ex .dot.done{background:var(--ok)}.cal.ex .dot.wip{background:var(--wip)}
.calnav{display:flex;align-items:center;gap:8px}
.calnav b{flex:1;text-align:center;font:600 18px var(--display)}
.calnav button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
dialog .in{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain}
dialog .in>.btns{position:sticky;bottom:-16px;background:var(--surface);padding:10px 0 16px;margin-bottom:-16px;border-top:1px solid var(--line)}
dialog h2{font-size:20px}
dialog img.pv{max-width:100%;border-radius:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sev{display:flex;gap:8px}
.sev button{flex:1;min-height:44px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.sev button[aria-pressed=true][data-v=low]{border-color:var(--ok)}
.sev button[aria-pressed=true][data-v=med]{border-color:var(--warn)}
.sev button[aria-pressed=true][data-v=high]{border-color:var(--crit)}
.err{flex-basis:100%;color:var(--crit);font-weight:600;font-size:15px}
.err.ok{color:var(--ok);font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:400;flex-direction:row}
.chk input{width:22px;height:22px;min-height:0;margin-top:2px;flex:none}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0}
.hist{display:flex;flex-direction:column;gap:8px}
.hist button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:48px}
.hist small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b0b0b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Login screen */
#login{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
#login .lg{max-width:420px;width:100%;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:14px}
#login h1{font:700 26px var(--display)}
#login h1::after{content:".";color:var(--brand)}
#login .sub{color:var(--muted);font-size:14px;margin-top:-8px}
#login input{background:var(--surface)}
#login .err{flex-basis:auto}
body.auth #bar,body.auth #app{display:none}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo img:not([src]){background:var(--line)}
/* Completed-day preview: always looks like the printed page (white paper), also in dark mode */
.rp{background:#fff;color:#1d1f22;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px 14px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.rp-hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rp-hd img:first-child{height:28px;width:auto}.rp-hd img:last-child{height:20px;width:auto}
.rp-rule{height:3px;background:linear-gradient(90deg,#ff3131 30%,#1d1f22 30%);margin-top:-4px}
.rp-ti{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rp-ti h2{font:700 22px var(--display);color:#1d1f22}.rp-ti h2::after{content:".";color:#ff3131}
.rp-sub{color:#787878;font-size:13px}
.rp-pill{flex:none;border:1.5px solid #1e9e57;color:#1e9e57;border-radius:99px;padding:2px 10px;font:700 11px var(--body);letter-spacing:.04em;margin-top:4px}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e1e1e1;border-radius:8px;overflow:hidden}
.rp-c{padding:7px 10px;border-right:1px solid #e1e1e1;border-bottom:1px solid #e1e1e1;display:flex;flex-direction:column;min-width:0}
.rp-c:nth-child(2n){border-right:0}.rp-c.w{grid-column:1/-1;border-right:0}
.rp-c span{font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#777}
.rp-c b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.rp-sec{display:flex;flex-direction:column;gap:6px;min-width:0}
.rp-sec h3{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#1d1f22;display:flex;align-items:center;gap:6px}
.rp-sec h3::before{content:"";width:3px;height:12px;border-radius:2px;background:#ff3131;flex:none}
.rp-sec h3::after{content:"";flex:1;height:1px;background:#e4e4e4}
.rp-box{background:#fafafa;border-left:3px solid #ddd;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.rp-e{color:#969696}
.rp-two{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:520px){.rp-two{grid-template-columns:1fr 1fr}}
.rp-chips{display:flex;flex-wrap:wrap;gap:6px}
.rp-chip{background:#f4f4f4;border-radius:5px;padding:3px 9px;font-size:13px}.rp-chip.dk{background:#1d1f22;color:#fff}
.rp-risk{border-bottom:1px solid #ebebeb;padding:6px 0}
.rp-rt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rp-lv{flex:none;color:#fff;font:700 10px var(--body);border-radius:4px;padding:2px 7px}
.rp-lv.high{background:#d9342b}.rp-lv.med{background:#e68c0a}.rp-lv.low{background:#1e9e57}
.rp-risk ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.rp-t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rp-t th{text-align:left;font:700 9.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:#777;border-bottom:1.5px solid #1d1f22;padding:3px 4px}
.rp-t td{border-bottom:1px solid #ebebeb;padding:5px 4px;overflow-wrap:anywhere}
.rp-t th:first-child,.rp-t td:first-child{width:36%}
.rp-ph{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-ph figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.rp-ph img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#e9edf0;border-radius:4px;cursor:zoom-in}
.rp-ph figcaption{font-size:12.5px;overflow-wrap:anywhere}.rp-ph figcaption b{color:#ff3131}
.rp-ft{border-top:1px solid #e4e4e4;padding-top:6px;font-size:11px;color:#888}
</style>
</head>
<body>

<header class="top">
  <div class="r1">
    <img id="logo" alt="Transform Group" width="154" height="32"><span class="tag">Site diary</span>
    <button id="pdfBtn" class="on">PDF</button>
  </div>
  <div class="r2">
    <button id="prev" aria-label="Previous day">&lsaquo;</button>
    <button type="button" id="date" aria-label="Choose a day"></button>
    <button id="next" aria-label="Next day">&rsaquo;</button>
    <button id="histBtn">All days</button>
  </div>
</header>

<main id="app"></main>

<nav class="bar" id="bar" aria-label="Quick add">
  <button data-add="photo"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
  <button data-add="delivery"><svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>Delivery</button>
  <button data-add="risk"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>Risk</button>
  <button data-add="delay"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Delay</button>
</nav>

<section id="login" hidden aria-labelledby="lgT">
  <header class="top" style="position:static"><div class="r1"><img id="logo2" alt="Transform Group" width="154" height="32" style="height:32px;width:auto"><span class="tag">Site diary</span></div></header>
  <form class="lg" id="lgForm" novalidate>
    <h1 id="lgT">Log in</h1>
    <div class="sub">Your diary is private. Log in once on this phone and it stays logged in.</div>
    <label>Email<input type="email" id="lgEmail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required></label>

/* Photo files kept on the phone (IndexedDB) so they show and print offline. */
const idb=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("siteDiary",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("photos",mode),s=t.objectStore("photos"),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
  return {get:k=>run("readonly",s=>s.get(k)).catch(()=>null),set:(k,v)=>run("readwrite",s=>s.put(v,k)),del:k=>run("readwrite",s=>s.delete(k)).catch(()=>{}),clear:()=>run("readwrite",s=>s.clear()).catch(()=>{})}})();
const photoURLs={};
async function photoBlob(p){
  let b=await idb.get(p.id);if(b)return b;
  if(!sb||!p.path)throw new Error("no photo");
  const {data,error}=await sb.storage.from("photos").download(p.path);if(error)throw error;
  try{await idb.set(p.id,data)}catch(e){}return data;
}
async function photoURL(p){if(photoURLs[p.id])return photoURLs[p.id];const b=await photoBlob(p);return photoURLs[p.id]=URL.createObjectURL(b)}
function fillPhotos(root){root.querySelectorAll("img[data-pid]").forEach(im=>{const p=findPhoto(im.dataset.pid);if(!p)return;
  photoURL(p).then(u=>{im.src=u}).catch(()=>{im.alt="Photo not on this phone yet";im.removeAttribute("src")})})}
function findPhoto(id){for(const k in days){const d=days[k];const p=d&&Array.isArray(d.photos)&&d.photos.find(x=>x.id===id);if(p)return p}return null}
const uuid=()=>{if(crypto.randomUUID)return crypto.randomUUID();const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};

const settingValue=k=>k==="project"?Object.fromEntries(PROJ_KEYS.map(x=>[x,DEFAULTS[x]])):k==="risks"?{list:clone(risks)}:k==="areas"?{list:areasList.slice()}:{list:delTypes.slice()};
const dayData=d=>{const o=clone(d);delete o.photos;PROJ_KEYS.forEach(k=>delete o[k]);return o};
const online=()=>navigator.onLine!==false;
let flushing=false,again=false,flushTimer=null;
function soon(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms==null?600:ms)}
function finalStatus(){status(pendingCount()?"Saved on this phone only":"Saved")}
async function flush(){
  if(flushing){again=true;return}
  const u=storedUser();
  if(!sb||!u||!online()){finalStatus();return}
  flushing=true;
  try{
    for(const id of outbox.uploads.slice()){
      const p=findPhoto(id),b=p&&await idb.get(id);
      if(p&&b){const {error}=await sb.storage.from("photos").upload(p.path,b,{upsert:true,contentType:b.type||"image/jpeg"});if(error)throw error}
      outbox.uploads=outbox.uploads.filter(x=>x!==id);saveOutbox();
    }
    for(const k of Object.keys(outbox.settings)){const ts=outbox.settings[k];
      const {error}=await sb.from("settings").upsert({owner_id:u.id,key:k,value:settingValue(k),updated_at:new Date().toISOString()});if(error)throw error;
      if(outbox.settings[k]===ts){delete outbox.settings[k];saveOutbox()}}
    for(const id of Object.keys(outbox.days)){const ts=outbox.days[id],d=days[id];
      if(d){
        const r1=await sb.from("days").upsert({owner_id:u.id,day:id,data:dayData(d),updated_at:new Date().toISOString()});if(r1.error)throw r1.error;
        const rows=(d.photos||[]).filter(p=>p.id&&p.path).map((p,i)=>({id:p.id,owner_id:u.id,day:id,storage_path:p.path,caption:p.caption||"",taken_time:p.time||"",position:i,updated_at:new Date().toISOString()}));
        if(rows.length){const r2=await sb.from("photos").upsert(rows);if(r2.error)throw r2.error}
        let q=sb.from("photos").delete().eq("day",id);if(rows.length)q=q.not("id","in",`(${rows.map(r=>r.id).join(",")})`);
        const r3=await q;if(r3.error)throw r3.error;
      }
      if(outbox.days[id]===ts){delete outbox.days[id];saveOutbox()}}
    if(outbox.removes.length){const paths=outbox.removes.slice();const {error}=await sb.storage.from("photos").remove(paths);if(error)throw error;
      outbox.removes=outbox.removes.filter(x=>!paths.includes(x));saveOutbox()}
  }catch(e){console.warn("sync",e)}
  flushing=false;
  if(again){again=false;return flush()}
  finalStatus();
}
/* Bring in what's on Supabase (e.g. typed on another device). Local unsent edits win. */
let pulling=false;
async function pull(){
  if(!sb||!storedUser()||!online()||pulling)return;pulling=true;
  try{
    const [a,b,c]=await Promise.all([sb.from("days").select("day,data"),sb.from("photos").select("id,day,storage_path,caption,taken_time,position").order("position"),sb.from("settings").select("key,value")]);
    if(a.error||b.error||c.error)throw a.error||b.error||c.error;
    const ph={};(b.data||[]).forEach(r=>{(ph[r.day]=ph[r.day]||[]).push({id:r.id,path:r.storage_path,caption:r.caption,time:r.taken_time})});
    (a.data||[]).forEach(r=>{if(outbox.days[r.day])return;days[r.day]=fix({...clone(r.data||{}),photos:ph[r.day]||[]})});
    (c.data||[]).forEach(r=>{if(outbox.settings[r.key])return;const v=r.value||{};
      if(r.key==="project")setProj(v);
      else if(r.key==="risks"){const n=normRisks(v.list);if(n.length)risks=n}
      else if(r.key==="areas"){const n=strList(v.list);if(n.length)areasList=n}
      else if(r.key==="delivery"){const n=strList(v.list);if(n.length)delTypes=n}});
    applyProj();saveLocal();
    const ae=document.activeElement;
    if(!document.querySelector("dialog[open]")&&!(ae&&ae.matches&&ae.matches("input,textarea,select")))render();
  }catch(e){console.warn("pull",e)}
  pulling=false;
}
function saveProj(){

}

function drawAreas(root){
  const box=root.querySelector("#areasBox");if(!box)return;const d=day();const NEW="__new__";

      <label class="chk"><input type="checkbox" id="asv" checked>Save to my standard list</label>
      <button class="btn primary" id="aa" type="button" style="align-self:flex-start">Add area</button></div>
    <div style="margin-top:10px;font-size:14px;color:var(--muted);font-weight:500">Selected</div>
    <div class="chips" style="margin-top:6px">${d.areasSel.map((a,i)=>`<button type="button" class="chip" data-x="${i}" aria-pressed="true" aria-label="Remove ${esc(a)}">${esc(a)} &times;</button>`).join("")||'<span class="empty">None selected.</span>'}</div>`;

    const v=e.target.value;box.querySelector("#anw").hidden=v!==NEW;
    if(v===NEW){box.querySelector("#an").focus();return}
    if(v==="")return;d.areasSel.push(left[v]);sync()};

  box.querySelector("#aa").onclick=add;box.querySelector("#an").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};

/* ---------- automatic weather (Open-Meteo, free, no key; address lookup via OpenStreetMap) ---------- */
const LSG="siteDiary.geo";
const wxText=d=>{const w=d&&d.wx;if(!w)return"";const p=[];if(w.max!=null)p.push(`${Math.round(w.max)}°/${Math.round(w.min)}°`);if(w.rain!=null)p.push(`${w.rain} mm rain`);if(w.wind!=null)p.push(`wind ${Math.round(w.wind)} km/h`);return p.join(", ")};
const wxLabel=d=>d.wx&&d.wx.rain>0?`${d.weather}, ${d.wx.rain} mm`:d.weather;
function wxPick(w){const c=Number(w.code);
  if(w.rain>=10||[65,67,82,95,96,99].includes(c))return"Heavy rain";
  if(w.rain>=0.5||(c>=61&&c<=67)||(c>=80&&c<=82))return"Light rain";
  if(w.max>=35)return"Hot";
  if(w.wind>=40)return"Windy";
  if(c<=1)return"Clear";if(c===2)return"Partly cloudy";return"Overcast"}
function geoCache(){try{const g=JSON.parse(localStorage.getItem(LSG)||"null");return g&&g.address===String(DEFAULTS.address||"").trim()?g:null}catch(e){return null}}
async function siteGeo(){
  const addr=String(DEFAULTS.address||"").trim();if(!addr)return null;
  const c=geoCache();if(c)return c.none?null:c;
  const qs=[...new Set([addr,addr.replace(/^[\d\s\-\/]+/,""),addr.split(/\s+/).pop()])].filter(Boolean);
  for(const q of qs){
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q=${encodeURIComponent(q)}`);
    if(!r.ok)continue;const j=await r.json();
    if(j&&j[0]){const g={address:addr,lat:Number(j[0].lat),lon:Number(j[0].lon),label:String(j[0].display_name||q).split(",").slice(0,2).join(",")};try{localStorage.setItem(LSG,JSON.stringify(g))}catch(e){}return g}}
  try{localStorage.setItem(LSG,JSON.stringify({address:addr,none:true}))}catch(e){}
  return null}
function wxInfoHTML(d){
  if(d.weatherManual)return "Weather set by you.";
  if(d.wx)return `Automatic: ${esc(wxText(d))}`;
  if(!String(DEFAULTS.address||"").trim())return "Add the site address to get the weather automatically.";
  const g=geoCache();if(g&&g.none)return `Couldn't find the site address. <button type="button" class="del" id="wxLoc" style="padding:0;min-height:0">Use my location</button>`;
  if(cur>iso(new Date()))return "The weather fills in automatically on the day.";
  if(!online())return "No signal. The weather fills in when you're back online.";
  if(wxState[cur]==="fail")return "Couldn't get the weather. Tap the button to try again.";
  if(wxState[cur]==="loading")return "Looking up the weather…";
  return "";
}
const wxState={},wxAsked={};
function drawWxInfo(){const e=document.getElementById("wxInfo");if(!e)return;const d=day();
  const g=geoCache(),noAddr=!!(g&&g.none);
  e.innerHTML=`${noAddr?`<span style="flex:1;min-width:0">Couldn't find the site address. <button type="button" class="del" id="wxLoc" style="padding:0;min-height:0">Use my location</button></span>`:'<span style="flex:1"></span>'}<button type="button" class="btn" id="wxGo" style="flex:none;min-height:38px;padding:0 12px;font-size:14px">&#8635; Automatic weather</button>`;
  e.querySelector("#wxGo").onclick=()=>{
    if(!String(DEFAULTS.address||"").trim()){toast("Add the site address first");return}
    if(cur>iso(new Date())){toast("The weather can only be filled in on the day");return}
    if(!online()){toast("No signal. Try again when you're online.");return}
    d.weatherManual=false;if(d.wx){d.wx.at=0;d.wx.final=false}delete wxState[cur];
    try{const g=JSON.parse(localStorage.getItem(LSG)||"null");if(g&&g.none)localStorage.removeItem(LSG)}catch(z){}
    if(hasContent(d))queueSave();wxAsked[cur]=1;toast("Getting the weather");autoWeather(cur)};
  const l=e.querySelector("#wxLoc");if(l)l.onclick=()=>{if(!navigator.geolocation){toast("Location isn't available on this phone");return}
    navigator.geolocation.getCurrentPosition(p=>{try{localStorage.setItem(LSG,JSON.stringify({address:String(DEFAULTS.address||"").trim(),lat:p.coords.latitude,lon:p.coords.longitude,label:"phone location"}))}catch(x){}autoWeather(cur)},()=>toast("Couldn't get your location"))};
}
const wxBusy={};
async function autoWeather(id){
  const d=days[id];if(!d||d.completed||d.weatherManual||!online()||id>iso(new Date())||(d.wx&&(d.wx.final||Date.now()-(d.wx.at||0)<18e5))||wxBusy[id])return;
  wxBusy[id]=1;wxState[id]="loading";let good=false;
  try{
    const g=await siteGeo();if(!g){if(id===cur)drawWxInfo();return}
    const q=`latitude=${g.lat}&longitude=${g.lon}&daily=weather_code,precipitation_sum,temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Australia%2FSydney&start_date=${id}&end_date=${id}`;
    let r=await fetch("https://api.open-meteo.com/v1/forecast?"+q);
    if(!r.ok)r=await fetch("https://archive-api.open-meteo.com/v1/archive?"+q);
    if(!r.ok)return;
    const D=(await r.json()).daily;if(!D||!D.time||!D.time.length||D.temperature_2m_max[0]==null)return;
    const w={code:D.weather_code[0],rain:Math.round((D.precipitation_sum[0]||0)*10)/10,max:D.temperature_2m_max[0],min:D.temperature_2m_min[0],wind:D.wind_speed_10m_max[0],final:id<iso(new Date()),at:Date.now()};
    const x=days[id];if(!x||x.completed||x.weatherManual)return;
    x.wx=w;x.weather=wxPick(w);
    if(hasContent(x)){markDay(id);soon()}saveLocal();
    good=true;delete wxState[id];
    if(id===cur){const sel=document.querySelector('[data-f=weather]');if(sel&&document.activeElement!==sel)sel.value=x.weather}
  }catch(e){console.warn("weather",e)}finally{delete wxBusy[id];if(!good&&wxState[id]==="loading")wxState[id]="fail";
    if(wxAsked[id]){delete wxAsked[id];const x=days[id];toast(good&&x?`Weather: ${x.weather} (${wxText(x)})`:(geoCache()||{}).none?"Couldn't find the site address":"Couldn't get the weather. Try again later.")}
    if(id===cur)drawWxInfo()}
}

/* ---------- copy from the previous diary day ---------- */
const shortDay=k=>new Date(k+"T12:00:00").toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
function prevDiaryDay(id){return Object.keys(days).filter(k=>k<id&&hasContent(days[k])).sort().pop()||null}
const copyPart=x=>JSON.stringify([x.crew,x.areasSel,x.risks,x.ongoing||"",String(x.hours)]);
function sameAsPrev(d,prev){const p=days[prev];return !!p&&copyPart(fix(clone(d)))===copyPart(fix(clone(p)))}
function copyFrom(prev){const d=day(),p=fix(clone(days[prev]));
  const has=CREW.some(n=>d.crew[n])||d.areasSel.length||d.risks.length||String(d.ongoing||"").trim();
  if(has&&!confirm(`Replace today's crew numbers, working areas, risks, hours and ongoing delays with ${shortDay(prev)}'s?`))return;
  d.crew=clone(p.crew);d.areasSel=p.areasSel.slice();d.areas=p.areas;d.risks=clone(p.risks);d.ongoing=p.ongoing;d.hours=p.hours;
  queueSave();render();scrollTo(0,0);toast("Copied from "+shortDay(prev))}

/* ---------- backup to a file ---------- */
function backupFlow(){
  sheet("Download backup",`<div class="empty">Saves every diary day, your project details and your saved lists (risks, areas, delivery types) in one file. Keep it in Files or Google Drive, or email it to yourself.</div>
    <label class="chk"><input type="checkbox" id="bkPh">Include photos (bigger file, takes longer)</label><div id="bkMsg" class="empty"></div>`,"Make backup",async b=>{
    const m=b.querySelector("#bkMsg"),withPh=b.querySelector("#bkPh").checked;m.textContent="Making the backup";
    const out={exported:iso(new Date()),app:"Site Diary "+APP_VERSION,diary:{},settings:{project:settingValue("project"),risks:clone(risks),areas:areasList.slice(),delivery:delTypes.slice()}};
    let n=0,miss=0;
    for(const k of Object.keys(days).sort()){const x=days[k];if(!x||!(hasContent(x)||x.completed))continue;const c=clone(x);
      if(withPh)for(const p of c.photos||[]){try{p.data=await toDataUrl(await photoBlob(p))}catch(e){miss++}}
      out.diary[k]=c;n++}
    const fn=`site-diary-backup-${iso(new Date())}.json`;
    offerFile(m,new Blob([JSON.stringify(out,null,1)],{type:"application/json"}),fn,"application/json","backup");
    m.insertAdjacentHTML("afterbegin",`<div>${n} day${n===1?"":"s"} saved${withPh?miss?`, ${miss} photo(s) couldn't be loaded (no signal?)`:", with photos":""}.</div>`);
    return false;
  });
}

function editRisk(r){
  const std=risks.find(x=>x.name.toLowerCase()===String(r.name).toLowerCase());
  let level=r.level||"med";
  const ctrls=(r.controls||[]).map(t=>({t,on:true}));
  (std?std.controls:[]).forEach(t=>{if(!ctrls.some(c=>c.t===t))ctrls.push({t,on:false})});
  const body=`<label>Risk<input type="text" id="en" value="${esc(r.name)}"></label>
    <div><div style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px">Controls in place</div><div id="ecl" style="display:flex;flex-direction:column;gap:8px"></div></div>
    <div class="row" style="grid-template-columns:1fr auto"><input type="text" id="ecn" placeholder="Add a control" aria-label="Add a control"><button class="btn" id="eca" type="button">Add control</button></div>
    <div><div style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px">Rating today</div>
    <div class="sev">${["low","med","high"].map(v=>`<button type="button" data-v="${v}" aria-pressed="${v===level}">${sevLabel(v)}</button>`).join("")}</div></div>
    <div class="empty">New controls are saved to this risk in your standard list.</div>`;
  sheet("Edit risk",body,"Save changes",b=>{
    const pend=b.querySelector("#ecn").value.trim();if(pend)ctrls.push({t:pend,on:true,fresh:true});
    const name=b.querySelector("#en").value.trim();if(!name){toast("The risk needs a name");return false}
    r.name=name;r.level=level;r.controls=ctrls.filter(c=>c.on).map(c=>c.t);
    const st=risks.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(st){let ch=false;ctrls.filter(c=>c.fresh).forEach(c=>{if(!st.controls.includes(c.t)){st.controls.push(c.t);ch=true}});if(ch)saveRisks()}
    queueSave();render();
  },b=>{
    const draw=()=>{b.querySelector("#ecl").innerHTML=ctrls.map((c,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${c.on?"checked":""}>${esc(c.t)}</label>`).join("")||'<div class="empty">No controls yet. Add one below.</div>';
      b.querySelectorAll("#ecl input").forEach(x=>x.onchange=()=>ctrls[x.dataset.i].on=x.checked)};
    const add=()=>{const i=b.querySelector("#ecn"),t=i.value.trim();if(!t)return;ctrls.push({t,on:true,fresh:true});i.value="";draw()};
    b.querySelector("#eca").onclick=add;b.querySelector("#ecn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add()}};
    b.querySelectorAll(".sev button").forEach(x=>x.onclick=()=>{level=x.dataset.v;b.querySelectorAll(".sev button").forEach(y=>y.setAttribute("aria-pressed",y===x))});

}
function riskFlow(){
  const NEW="__new__";let ctrls=[],level="med",added=[];const api={};
  const opts=()=>`<option value="" selected>Select a risk</option><option value="${NEW}">+ New risk</option>${risks.map((r,i)=>`<option value="${i}">${esc(r.name)}</option>`).join("")}`;
  const body=`<label>Risk<select id="rs">${opts()}</select></label>
    <label id="nnw" hidden>New risk name<input type="text" id="rn" placeholder="Example: Working near live crane"></label>
    <div><div style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px">Controls in place</div><div id="cl" style="display:flex;flex-direction:column;gap:8px"></div></div>
    <div class="row" style="grid-template-columns:1fr auto"><input type="text" id="cn" placeholder="Add a control" aria-label="Add a control"><button class="btn" id="ca" type="button">Add control</button></div>
    <div><div style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px">Rating today</div>
    <div class="sev">${["low","med","high"].map(v=>`<button type="button" data-v="${v}" aria-pressed="${v===level}">${sevLabel(v)}</button>`).join("")}</div></div>
    <div class="empty">New risks and controls you add are saved to your standard list.</div>
    <div id="added" hidden><div style="font-size:14px;color:var(--muted);font-weight:500;margin-bottom:6px">Added today</div><div id="al" class="dl"></div></div>`;
  sheet("Add risk of the day",body,"Add risk",b=>{
    const sel=b.querySelector("#rs").value,isNew=sel===NEW;
    if(sel===""){toast("Select a risk first");return false}
    const pend=b.querySelector("#cn").value.trim();if(pend){ctrls.push({t:pend,on:true,fresh:true});b.querySelector("#cn").value=""}
    const name=isNew?b.querySelector("#rn").value.trim():risks[sel].name;
    if(!name){toast("Name the risk first");return false}
    const picked=ctrls.filter(c=>c.on).map(c=>c.t);
    const obj={name,level,controls:picked};day().risks.push(obj);added.push(obj);
    queueSave();try{render()}catch(e){}
    try{
      if(isNew){
        const ex=risks.find(r=>r.name.toLowerCase()===name.toLowerCase());
        if(ex){picked.forEach(t=>{if(!ex.controls.includes(t))ex.controls.push(t)})}else risks=[...risks,{name,controls:picked.slice()}];
      }else{
        ctrls.filter(c=>c.fresh).forEach(c=>{if(!risks[sel].controls.includes(c.t))risks[sel].controls.push(c.t)});
      }
      saveRisks();
    }catch(e){}
    api.reset(b);okMsg("Added to today: "+name);return false;
  },b=>{
    $("#scl").textContent="Done";
    const draw=()=>{b.querySelector("#cl").innerHTML=ctrls.map((c,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${c.on?"checked":""}>${esc(c.t)}</label>`).join("")||`<div class="empty">${b.querySelector("#rs").value===""?"Pick a risk to see its controls.":"No controls yet. Add one below."}</div>`;
      b.querySelectorAll("#cl input").forEach(x=>x.onchange=()=>ctrls[x.dataset.i].on=x.checked)};
    const load=()=>{const s=b.querySelector("#rs").value;b.querySelector("#nnw").hidden=s!==NEW;
      ctrls=(s===NEW||s==="")?[]:risks[s].controls.map(t=>({t,on:true}));draw()};
    b.querySelector("#rs").onchange=load;
    const addCtl=()=>{const i=b.querySelector("#cn"),t=i.value.trim();if(!t)return;ctrls.push({t,on:true,fresh:true});i.value="";draw()};
    b.querySelector("#ca").onclick=addCtl;
    b.querySelector("#cn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addCtl()}};
    b.querySelector("#rn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.querySelector("#cn").focus()}};
    b.querySelectorAll(".sev button").forEach(x=>x.onclick=()=>{level=x.dataset.v;b.querySelectorAll(".sev button").forEach(y=>y.setAttribute("aria-pressed",y===x))});
    const renderAdded=()=>{
      b.querySelector("#added").hidden=!added.length;
      b.querySelector("#al").innerHTML=added.map((r,i)=>`<div class="it"><span>${esc(r.name)}<br><small>${sevLabel(r.level)} · ${(r.controls||[]).length} controls</small></span><span style="display:flex;gap:10px"><button type="button" class="del" data-ae="${i}" style="color:var(--ink)">Edit</button><button type="button" class="del" data-ar="${i}">Remove</button></span></div>`).join("");
      b.querySelectorAll("[data-ae]").forEach(x=>x.onclick=()=>editRisk(added[x.dataset.ae]));
      b.querySelectorAll("[data-ar]").forEach(x=>x.onclick=()=>{const o=added[x.dataset.ar],j=day().risks.indexOf(o);if(j>=0)day().risks.splice(j,1);added.splice(x.dataset.ar,1);queueSave();render();renderAdded()});
    };
    api.reset=()=>{
      b.querySelector("#rs").innerHTML=opts();b.querySelector("#rs").value="";b.querySelector("#rn").value="";b.querySelector("#cn").value="";
      level="med";b.querySelectorAll(".sev button").forEach(y=>y.setAttribute("aria-pressed",y.dataset.v==="med"));
      load();renderAdded();
      try{b.querySelector("#added").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}
    };
    load();
  });
}

function shrink(file,max=1600,q=.82){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",q)};
    img.onerror=()=>rej(new Error("load"));img.src=u});
}
const toDataUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
function photoFlow(){
  sheet("Add a photo",`<div class="btns"><label class="btn primary" style="flex-direction:row;align-items:center;color:var(--accent-ink)">Take photo<input type="file" accept="image/*" capture="environment" id="fc" hidden></label>

}

let calM="";
function calendar(){
  if(!calM)calM=cur.slice(0,7);
  const [y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,n=new Date(y,m,0).getDate(),t=iso(new Date());
  let cells="";for(let i=0;i<lead;i++)cells+='<span class="x"></span>';
  for(let dd=1;dd<=n;dd++){const k=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`,st=dayStatus(k);
    cells+=`<button type="button" data-k="${k}" class="${st} ${k===t?"today":""} ${k===cur?"cur":""}" aria-label="${esc(nice(k))}, ${st==="done"?"completed":st==="wip"?"in progress":"no diary"}">${dd}</button>`}
  const body=`<div class="calnav"><button type="button" id="cp" aria-label="Previous month" ${yearOK((m===1?y-1:y)+"-01-01")?"":"disabled style=\"opacity:.35\""}>&lsaquo;</button><b>${esc(first.toLocaleDateString("en-AU",{month:"long",year:"numeric"}))}</b><button type="button" id="cn" aria-label="Next month" ${yearOK((m===12?y+1:y)+"-01-01")?"":"disabled style=\"opacity:.35\""}>&rsaquo;</button></div>
    <div class="cal">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Completed</span><span><i style="background:var(--wip)"></i>In progress</span><span><i style="background:var(--bg)"></i>No diary</span></div>
    <div class="btns"><button class="btn" id="ct" type="button">Go to today</button><button class="btn" id="bk" type="button">Download backup</button></div>
    <div class="acct"><span>${esc((storedUser()||{}).email||"")}${pendingCount()?" · "+pendingCount()+" change(s) waiting to sync":""}</span><button class="del" id="lo" type="button">Log out</button></div>
    <div class="empty" style="font-size:12px;text-align:right">Site Diary ${APP_VERSION}</div>`;
  sheet("All days",body,null,null,b=>{
    b.querySelector("#lo").onclick=logout;
    b.querySelector("#bk").onclick=backupFlow;
    const mv=d=>{const dt=new Date(y,m-1+d,1);if(!yearOK(`${dt.getFullYear()}-01-01`))return;calM=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;calendar()};
    b.querySelector("#cp").onclick=()=>mv(-1);b.querySelector("#cn").onclick=()=>mv(1);
    b.querySelector("#ct").onclick=()=>{$("#dlg").close();go(iso(new Date()))};
    b.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{$("#dlg").close();go(x.dataset.k)});
  });
}

function asText(id){
  id=id||cur;const d=days[id]||day(),L=[];
  L.push("SITE DIARY",`Builder: ${d.builder}`,`Project: ${d.project}`,`Address: ${d.address||"-"}`,`Date: ${nice(id)}`,`Hours: ${d.hours}`,`Weather: ${d.weather}${d.wx?` (${wxText(d)})`:""}`,"","MANPOWER");
  CREW.forEach(n=>{if(d.crew[n])L.push(`  ${n}: ${d.crew[n]}`)});L.push(`  Total men: ${total(d)}`,"",`Working areas: ${d.areas||"-"}`,"","RISK OF THE DAY");
  if(d.risks.length)d.risks.forEach(r=>{L.push(`  [${sevLabel(r.level).toUpperCase()}] ${r.name}`);(r.controls||[]).forEach(c=>L.push(`     - ${c}`))});else L.push("  -");
  L.push("","CRANE ACTIVITY",`  Hours: ${craneRanges(d).join(", ")||"-"}`);if(d.craneNote)L.push(`  Notes: ${d.craneNote}`);
  L.push("",`CONCRETE POUR: ${d.pour||"-"}`,"","DELIVERIES");
  if(d.deliveries.length)d.deliveries.forEach(r=>L.push(`  ${r.dir||"Delivery"}: ${r.type||""}  (${r.arrive||"--:--"} to ${r.depart||"--:--"})`));else L.push("  -");
  L.push("",`SITE ACTIVITY: ${d.activity||"-"}`,`DECK AND VERTICALS HANDOVER: ${d.handover||"-"}`,`VARIATIONS: ${d.variations||"-"}`,`DELAYS: ${d.delays||"-"}`,`ONGOING DELAYS: ${d.ongoing||"-"}`,`ACCIDENTS / INJURIES: ${d.accidents||"-"}`);
  if(d.photos.length){L.push("","PHOTOS");d.photos.forEach((p,i)=>L.push(`  ${i+1}. ${p.caption||"(no caption)"}`))}
  return L.join("\n");
}

async function buildPDFNew(ids){

    doc.text(T,x+3,y+2.9);const tw=doc.getTextWidth(T);
    doc.setDrawColor(228,228,228);doc.setLineWidth(.2);const lx=x+3+tw+2;if(lx<x+w)doc.line(lx,y+1.8,x+w,y+1.8);y+=6};
  const drawBox=(x,w,L,h,empty)=>{doc.setFillColor(250,250,250);doc.rect(x,y,w,h,"F");doc.setFillColor(221,221,221);doc.rect(x,y,.8,h,"F");
    font("normal",9.5);col(empty?[150,150,150]:INK);L.forEach((l,i)=>doc.text(l,x+4,y+4.4+i*4.4))};
  const textBox=(heading,text)=>{const t=clean(text).trim();font("normal",9.5);const L=split(t||"-",CW-7),h=L.length*4.4+4.2;

    drawBox(M,CW,L,h,!t);y+=h+4};
  const two=(ha,ta,hb,tb)=>{const cw=(CW-5)/2;font("normal",9.5);const a=clean(ta).trim(),b=clean(tb).trim();
    const La=split(a||"-",cw-7),Lb=split(b||"-",cw-7),h=Math.max(La.length,Lb.length)*4.4+4.2;
    ensure(6+h);const y0=y;sec(ha,M,cw);drawBox(M,cw,La,h,!a);y=y0;sec(hb,M+cw+5,cw);drawBox(M+cw+5,cw,Lb,h,!b);y=y0+6+h+4};
  const cut=(t,w)=>{const L=split(String(t==null||t===""?"-":t),w);return L.length>1?L[0].replace(/\s*\S{0,2}$/,"")+"...":L[0]};

    const cell=(label,val,c,r,span)=>{const x=M+c*cw4+3;font("bold",6.2);col([119,119,119]);doc.text(label.toUpperCase(),x,y+r*rh+4.3);font("bold",9.5);col(INK);doc.text(cut(val,cw4*span-6),x,y+r*rh+9)};

        doc.setDrawColor(235,235,235);doc.setLineWidth(.2);doc.line(M,y+h,M+CW,y+h);y+=h});

/* Hand the finished PDF to the phone: Share (Save to Files, Mail, WhatsApp) or Open/Download. */
let pdfURL=null;
function offerFile(mm,blob,fn,type,what){
  if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=URL.createObjectURL(blob);
  let file=null;try{file=new File([blob],fn,{type})}catch(e){}
  let canShare=false;try{canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  if(!canShare&&type!=="application/pdf"){try{const f2=new File([blob],fn,{type:"text/plain"});if(navigator.canShare&&navigator.canShare({files:[f2]})){file=f2;canShare=true}}catch(e){}}
  const W=what==="PDF"?"PDF":"file";
  mm.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><b style="color:var(--ink)">${what==="PDF"?"PDF":"Backup"} ready: ${esc(fn)}</b><div class="btns">${canShare?`<button class="btn primary" id="pdfShare" type="button">Share or save ${W}</button>`:""}<a class="btn ${canShare?"":"primary"}" id="pdfOpen" href="${pdfURL}" download="${esc(fn)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:${canShare?"var(--ink)":"var(--accent-ink)"}">${canShare?`Open ${W}`:`Download ${W}`}</a></div></div>`;
  const sh=mm.querySelector("#pdfShare");
  if(sh)sh.onclick=async()=>{try{await navigator.share({files:[file],title:fn})}catch(e){if(e&&e.name!=="AbortError")toast(`Sharing didn't work. Use Open ${W} instead.`)}};
  if(!canShare&&!/iPhone|iPad|iPod/.test(navigator.userAgent)){try{mm.querySelector("#pdfOpen").click()}catch(e){}}
}
const offerPdf=(mm,blob,fn)=>offerFile(mm,blob,fn,"application/pdf","PDF");
let exFrom="",exTo="",exM="",exFresh=false;
function exportIds(){
  if(!exFrom)return [];
  const a=exFrom,b=exTo||exFrom;
  if(a===b)return [a];
  return Object.keys(days).filter(k=>k>=a&&k<=b&&dayStatus(k)!=="blank").sort();
}
function exportSheet(msgText){
  const [y,m]=exM.split("-").map(Number),first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,n=new Date(y,m,0).getDate(),t=iso(new Date());
  const lo=exFrom,hi=exTo||exFrom;
  let cells="";for(let i=0;i<lead;i++)cells+='<span class="x"></span>';
  for(let dd=1;dd<=n;dd++){const k=`${y}-${String(m).padStart(2,"0")}-${String(dd).padStart(2,"0")}`,st=dayStatus(k);
    const inr=lo&&k>=lo&&k<=hi,edge=k===lo||k===hi;
    cells+=`<button type="button" data-k="${k}" class="${st} ${k===t?"today":""} ${inr?"inr":""} ${edge?"edge":""}" aria-label="${esc(nice(k))}">${st!=="blank"?`<i class="dot ${st}"></i>`:""}${dd}</button>`}
  const ids=exportIds(),sh=k=>new Date(k+"T12:00:00").toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
  const info=exFresh?`${sh(exFrom)} is selected. To choose several days, tap the first day, then the last day.`:!exFrom?"Tap the first day.":!exTo?`First day: ${sh(exFrom)}. Now tap the last day (or make a PDF of just this day).`:`${sh(exFrom)} to ${sh(exTo)}: ${ids.length} day${ids.length===1?"":"s"} with a diary.`;
  const body=`<div class="calnav"><button type="button" id="xp" aria-label="Previous month">&lsaquo;</button><b>${esc(first.toLocaleDateString("en-AU",{month:"long",year:"numeric"}))}</b><button type="button" id="xn" aria-label="Next month">&rsaquo;</button></div>
    <div class="cal ex">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(x=>`<div class="h">${x}</div>`).join("")}${cells}</div>
    <div class="legend"><span><i style="background:var(--ok);border-radius:50%"></i>Completed</span><span><i style="background:var(--wip);border-radius:50%"></i>In progress</span><span><i style="background:rgba(255,49,49,.78)"></i>Will be printed</span></div>
    <div class="empty" id="xinfo" style="margin:6px 0"><b>${esc(info)}</b> Blank days are left out.</div>
    <div class="btns"><button class="btn primary" id="mk" ${ids.length?"":"disabled"}>${ids.length>1?`Make PDF (${ids.length} days)`:"Make PDF"}</button><button class="btn" id="cp2" ${ids.length?"":"disabled"}>Copy as text</button></div>
    <div id="msg" class="empty">${esc(msgText||"The PDF has the full days and all photos with captions.")}</div>`;
  sheet("Export PDF",body,null,null,b=>{
    const mv=d=>{const dt=new Date(y,m-1+d,1);exM=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;exportSheet()};
    b.querySelector("#xp").onclick=()=>mv(-1);b.querySelector("#xn").onclick=()=>mv(1);
    b.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{const k=x.dataset.k;
      if(!exFrom||exTo||exFresh){exFrom=k;exTo="";exFresh=false}else{if(k<exFrom){exTo=exFrom;exFrom=k}else exTo=k}
      exportSheet()});
    b.querySelector("#cp2").onclick=async()=>{const p=exportIds();if(!p.length)return;
      const t=p.map(k=>asText(k)).join("\n\n----------------------------------------\n\n");
      try{await navigator.clipboard.writeText(t);toast("Copied")}catch(e){b.querySelector("#msg").outerHTML=`<pre>${esc(t)}</pre>`}};
    b.querySelector("#mk").onclick=async()=>{
      const p=exportIds(),mm=b.querySelector("#msg");if(!p.length)return;
      mm.textContent=p.length>1?`Building the PDF (${p.length} days)`:"Building the PDF";
      try{
        const blob=await buildPDF(p);
        const fn=p.length>1?`site-diary-${p[0]}_to_${p[p.length-1]}.pdf`:`site-diary-${p[0]}.pdf`;
        offerPdf(mm,blob,fn);
      }catch(e){mm.textContent="Couldn't make the PDF. Try again, or use Copy as text."}
    };
  });
}

/* ---------- no zoom (iPhone ignores the viewport setting, so block the gestures) ---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
["touchstart","touchmove"].forEach(t=>document.addEventListener(t,e=>{if((e.touches&&e.touches.length>1)||(e.scale!==undefined&&e.scale!==1))e.preventDefault()},{passive:false,capture:true}));
/* If iPhone still manages to zoom (e.g. tapping a box), snap straight back to normal size. */
(()=>{const vp=document.querySelector('meta[name=viewport]'),base=vp.content;let busy=false;
  const reset=()=>{if(busy||!window.visualViewport||visualViewport.scale<=1.01)return;busy=true;
    vp.content=base.replace("maximum-scale=1","maximum-scale=1.01");setTimeout(()=>{vp.content=base;window.scrollTo(0,window.scrollY);busy=false},60)};
  if(window.visualViewport){visualViewport.addEventListener("resize",reset);visualViewport.addEventListener("scroll",()=>{if(visualViewport.offsetLeft>0)reset()})}
  document.addEventListener("focusout",()=>setTimeout(reset,100));
  document.addEventListener("touchend",()=>setTimeout(reset,50));
})();
